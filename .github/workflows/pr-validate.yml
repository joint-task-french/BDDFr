name: Validation PR

on:
  pull_request:
    branches: [master, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validation des données JSONC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Valider les JSONC avec les schémas
        run: npm run validate

  build-check:
    name: Build et smoke test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build de vérification
        run: npm run build

      - name: Cache Chrome (Puppeteer)
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Installation de Chrome
        run: npx puppeteer browsers install chrome

      # Charge reellement l'application dans un navigateur : c'est le seul
      # filet qui attrape un ecran blanc (versions React desynchronisees) ou un
      # catalogue vide (JSONC illisible) — le build, lui, reussit dans les deux
      # cas.
      - name: Smoke test (chargement navigateur)
        run: npm run smoke